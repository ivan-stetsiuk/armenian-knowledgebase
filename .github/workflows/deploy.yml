name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check repository invariants
        run: python scripts/check.py

      # decks/ is generated from data/*.tsv and committed, so it can go stale
      # without anything noticing — the CMS edits the TSV and never runs the
      # build. The Quizlet files are deterministic; the .apkg is a zip and
      # carries timestamps, so only the text output can be compared.
      - name: Check the committed flashcards match the data
        run: |
          python scripts/build_decks.py
          git diff --exit-code --stat -- decks/quizlet || {
            echo "::error::decks/ is stale — run python3 scripts/build_decks.py and commit the result"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      # astro build renders the pages; pagefind indexes the built HTML afterwards,
      # so search covers every word without a second index to keep in sync.
      - run: npm run build

      # Every directive in the content has to reach the page as the markup it
      # means. A `:::tab` that renders as a plain div still looks like content,
      # which is how the paradigm tabs stayed broken without anyone noticing.
      - name: Check the rendered markup
        run: |
          sets=$(grep -rho 'class="tabs" data-tabs' dist --include=index.html | wc -l | tr -d ' ')
          panels=$(grep -rho 'class="tabs__panel"' dist --include=index.html | wc -l | tr -d ' ')
          stray=$(grep -rhoE 'class="d-[a-z]+"' dist --include=index.html | sort -u | tr '\n' ' ')
          echo "tab sets: $sets, panels: $panels, unhandled directives: ${stray:-none}"
          test "$sets" -gt 0 && test "$panels" -ge "$sets" || (echo "::error::tab panels did not render" && exit 1)
          test -z "$stray" || (echo "::error::a directive reached the page unhandled: $stray" && exit 1)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
